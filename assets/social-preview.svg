<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f5f2ea"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="58" y="207" fill="#2d2a24" font-size="60" font-weight="bold">あなたの1秒って</text><text x="62" y="276" fill="#2f6f73" font-size="29">時計が消えたら、感覚で。</text><text x="62" y="326" fill="#776f63" font-size="25">お題の秒数に合わせて3回タップ</text><rect x="62" y="380" width="400" height="54" rx="27" fill="#fffdf7" stroke="#e4dccd"/><text x="262" y="416" text-anchor="middle" fill="#2d2a24" font-size="24">最初の3秒だけ時計が見えます</text><rect x="638" y="45" width="502" height="540" rx="28" fill="#fffdf7" stroke="#e4dccd"/><text x="889" y="94" text-anchor="middle" fill="#776f63" font-size="22">お題</text><rect x="668" y="114" width="143" height="50" rx="25" fill="#fffdf7" stroke="#e4dccd"/><text x="739.5" y="148" text-anchor="middle" fill="#2d2a24" font-size="27" font-weight="bold">6秒</text><rect x="817" y="114" width="143" height="50" rx="25" fill="#fffdf7" stroke="#e4dccd"/><text x="888.5" y="148" text-anchor="middle" fill="#2d2a24" font-size="27" font-weight="bold">15秒</text><rect x="966" y="114" width="143" height="50" rx="25" fill="#fffdf7" stroke="#e4dccd"/><text x="1037.5" y="148" text-anchor="middle" fill="#2d2a24" font-size="27" font-weight="bold">24秒</text><text x="889" y="276" text-anchor="middle" fill="#24575a" font-size="40" font-weight="bold">感覚で</text><text x="889" y="332" text-anchor="middle" fill="#24575a" font-size="40" font-weight="bold">押してください</text><rect x="668" y="375" width="143" height="72" rx="12" fill="#fffdf7" stroke="#e4dccd"/><text x="739.5" y="402" text-anchor="middle" fill="#776f63" font-size="18">1回目</text><text x="739.5" y="431" text-anchor="middle" fill="#2d2a24" font-size="23">--.--秒</text><rect x="817" y="375" width="143" height="72" rx="12" fill="#fffdf7" stroke="#e4dccd"/><text x="888.5" y="402" text-anchor="middle" fill="#776f63" font-size="18">2回目</text><text x="888.5" y="431" text-anchor="middle" fill="#2d2a24" font-size="23">--.--秒</text><rect x="966" y="375" width="143" height="72" rx="12" fill="#fffdf7" stroke="#e4dccd"/><text x="1037.5" y="402" text-anchor="middle" fill="#776f63" font-size="18">3回目</text><text x="1037.5" y="431" text-anchor="middle" fill="#2d2a24" font-size="23">--.--秒</text><rect x="668" y="468" width="441" height="78" rx="16" fill="#2f6f73"/><text x="889" y="518" text-anchor="middle" fill="white" font-size="32" font-weight="bold">ここで押す</text></g></svg>
