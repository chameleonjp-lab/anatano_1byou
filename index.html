<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>あなたの1秒って</title>
  <style>
    :root {
      --bg: #f5f2ea;
      --card: #fffdf7;
      --text: #2d2a24;
      --muted: #776f63;
      --line: #e4dccd;
      --accent: #2f6f73;
      --accent-dark: #24575a;
      --danger: #b84a4a;
      --danger-dark: #8f3636;
      --shadow: 0 12px 30px rgba(57, 49, 35, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #fff9e9 0%, var(--bg) 45%, #e8efe9 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      touch-action: manipulation;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 430px);
      min-height: calc(100vh - 28px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .screen.active {
      display: block;
    }

    .card {
      width: 100%;
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid rgba(228, 220, 205, 0.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 18px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .title {
      font-size: clamp(2rem, 9vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 16px;
    }

    .lead {
      color: var(--text);
      line-height: 1.75;
      font-size: 1rem;
      text-align: center;
      margin: 16px 0;
    }

    .notice {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.82rem;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 14px;
    }

    .best-box,
    .score-box {
      border: 1px solid var(--line);
      background: #fff8e9;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      font-weight: 800;
      margin: 12px 0;
    }

    .button-stack {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 15px 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 111, 115, 0.18);
      transition: transform 0.08s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      color: #fff;
      background: var(--accent);
    }

    .btn.primary:active {
      background: var(--accent-dark);
    }

    .btn.secondary {
      color: var(--accent-dark);
      background: #e7f1ef;
      box-shadow: none;
    }

    .btn.danger {
      color: #fff;
      background: var(--danger);
      box-shadow: none;
    }

    .btn.danger:active {
      background: var(--danger-dark);
    }

    .btn.tap {
      min-height: 78px;
      font-size: 1.35rem;
      border-radius: 22px;
      box-shadow: 0 12px 22px rgba(47, 111, 115, 0.25);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: default;
      transform: none;
    }

    .game-card {
      min-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .status {
      color: var(--muted);
      font-weight: 800;
      font-size: 0.92rem;
    }

    .retire-btn {
      border: 0;
      color: #fff;
      background: var(--danger);
      border-radius: 999px;
      padding: 9px 12px;
      font-weight: 800;
      min-width: 82px;
    }

    .target-area {
      background: #fff8e9;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
    }

    .label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .targets {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-weight: 900;
      font-size: clamp(1.18rem, 6vw, 1.7rem);
    }

    .target-pill {
      background: #fffdf7;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
    }

    .clock-area {
      flex: 1;
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px 0;
    }

    .clock {
      font-size: clamp(2.5rem, 16vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      white-space: pre-line;
    }

    .clock.note {
      font-size: clamp(1.7rem, 9vw, 2.8rem);
      color: var(--accent-dark);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tap-slot {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 14px;
      padding: 9px 4px;
      text-align: center;
      min-width: 0;
    }

    .tap-slot small {
      display: block;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.72rem;
      margin-bottom: 3px;
    }

    .tap-slot strong {
      display: block;
      font-size: clamp(0.95rem, 4.4vw, 1.25rem);
      word-break: keep-all;
    }

    .result-title {
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      text-align: center;
      margin-bottom: 12px;
    }

    .result-state {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .result-list {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }

    .result-row {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 16px;
      padding: 12px;
      line-height: 1.6;
    }

    .result-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .final-score {
      background: #e7f1ef;
      border: 1px solid #c6dedb;
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      font-size: 1.18rem;
      font-weight: 900;
      margin: 14px 0;
    }

    .sense-score {
      border: 1px solid #eadbb7;
      background: #fff8e8;
      border-radius: 18px;
      padding: 13px;
      text-align: center;
      line-height: 1.55;
      font-weight: 800;
      margin: 12px 0;
    }

    .sense-score small {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .best-update {
      color: var(--accent-dark);
      text-align: center;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(16px);
      background: rgba(45, 42, 36, 0.94);
      color: #fff;
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
      }

      .card {
        border-radius: 20px;
        padding: 18px 14px;
      }

      .game-card {
        min-height: calc(100vh - 20px);
        padding: 12px;
      }

      .results-grid {
        gap: 6px;
      }

      .target-pill {
        padding: 5px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <section id="homeScreen" class="screen active">
      <div class="card">
        <h1 class="title">あなたの<br />1秒って</h1>
        <div id="bestDisplay" class="best-box">ベストスコア：まだありません</div>
        <p class="lead">
          最初の3秒だけ時計が見えます。<br />
          そのあとは自分の感覚だけで、<br />
          お題の秒数に合わせてボタンを押してください。<br />
          ズレが小さいほど高記録です。
        </p>
        <p id="lastDisplay" class="notice" hidden></p>
        <p class="notice">
          ベストスコアは、このブラウザ内に保存されます。<br />
          保存データを消すと記録が消える場合があります。<br />
          別の端末では表示されません。
        </p>
        <div class="button-stack">
          <button id="startBtn" class="btn primary" type="button">ゲームスタート</button>
          <button id="shareGameBtn" class="btn secondary" type="button">ゲームをシェア</button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="card game-card">
        <div class="top-bar">
          <div id="statusText" class="status">準備中</div>
          <button id="retireBtn" class="retire-btn" type="button">リタイア</button>
        </div>

        <div class="target-area">
          <div class="label">お題</div>
          <div id="targetList" class="targets"></div>
        </div>

        <div class="clock-area">
          <div id="clockDisplay" class="clock">3</div>
        </div>

        <div class="results-grid" aria-label="タップ結果">
          <div class="tap-slot"><small>1回目</small><strong id="tapResult0">--.--秒</strong></div>
          <div class="tap-slot"><small>2回目</small><strong id="tapResult1">--.--秒</strong></div>
          <div class="tap-slot"><small>3回目</small><strong id="tapResult2">--.--秒</strong></div>
        </div>

        <button id="tapBtn" class="btn primary tap" type="button" disabled>ここで押す</button>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card">
        <h2 class="result-title">あなたの1秒って</h2>
        <div id="resultState" class="result-state">結果：クリア</div>
        <div id="resultSummary" class="score-box"></div>
        <div id="resultList" class="result-list"></div>
        <div id="finalScore" class="final-score"></div>
        <div id="senseScore" class="sense-score" hidden></div>
        <div id="bestUpdate" class="best-update" hidden>ベスト更新！</div>
        <div class="button-stack">
          <button id="shareResultBtn" class="btn secondary" type="button">ゲーム結果をシェア</button>
          <button id="retryBtn" class="btn primary" type="button">もう一度プレイ</button>
          <button id="finishBtn" class="btn secondary" type="button">ゲーム終了</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast">クリップボードにコピーしました</div>

  <script>
    const GAME_TITLE = 'あなたの1秒って';
    const GAME_DESCRIPTION = '最初の3秒だけ時計を見て、あとは体感で秒数を当てるゲームです。';
    const GAME_URL_PLACEHOLDER = '{ゲームURL未定}';
    const BEST_KEY = 'anatano_1byo_best_score_v1';
    const LAST_KEY = 'anatano_1byo_last_result_v1';
    const MAX_SECONDS = 40;
    const VISIBLE_CLOCK_SECONDS = 3;
    const TARGET_COUNT = 3;
    const TARGET_MIN = 6;
    const TARGET_MAX = 30;
    const MIN_TARGET_GAP = 4;

    const screens = {
      home: document.getElementById('homeScreen'),
      game: document.getElementById('gameScreen'),
      result: document.getElementById('resultScreen')
    };

    const elements = {
      bestDisplay: document.getElementById('bestDisplay'),
      lastDisplay: document.getElementById('lastDisplay'),
      startBtn: document.getElementById('startBtn'),
      shareGameBtn: document.getElementById('shareGameBtn'),
      statusText: document.getElementById('statusText'),
      retireBtn: document.getElementById('retireBtn'),
      targetList: document.getElementById('targetList'),
      clockDisplay: document.getElementById('clockDisplay'),
      tapBtn: document.getElementById('tapBtn'),
      tapResults: [
        document.getElementById('tapResult0'),
        document.getElementById('tapResult1'),
        document.getElementById('tapResult2')
      ],
      resultState: document.getElementById('resultState'),
      resultSummary: document.getElementById('resultSummary'),
      resultList: document.getElementById('resultList'),
      finalScore: document.getElementById('finalScore'),
      senseScore: document.getElementById('senseScore'),
      bestUpdate: document.getElementById('bestUpdate'),
      shareResultBtn: document.getElementById('shareResultBtn'),
      retryBtn: document.getElementById('retryBtn'),
      finishBtn: document.getElementById('finishBtn'),
      toast: document.getElementById('toast')
    };

    let game = createEmptyGame();
    let tickTimerId = null;
    let countdownTimerId = null;
    let endMessageTimerId = null;
    let toastTimerId = null;
    let latestShareText = '';

    function createEmptyGame() {
      return {
        phase: 'home',
        targets: [],
        taps: [],
        startedAt: 0,
        endedAt: 0,
        resultType: '',
        finalScore: null,
        senseResult: null,
        bestUpdated: false
      };
    }

    function showScreen(name) {
      Object.values(screens).forEach((screen) => screen.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function formatSeconds(value) {
      const safeValue = Number.isFinite(value) ? Math.max(0, value) : 0;
      return safeValue.toFixed(2) + '秒';
    }

    function getElapsedSeconds() {
      if (!game.startedAt) return 0;
      return (performance.now() - game.startedAt) / 1000;
    }

    function clearAllTimers() {
      if (tickTimerId !== null) {
        clearInterval(tickTimerId);
        tickTimerId = null;
      }
      if (countdownTimerId !== null) {
        clearTimeout(countdownTimerId);
        countdownTimerId = null;
      }
      if (endMessageTimerId !== null) {
        clearTimeout(endMessageTimerId);
        endMessageTimerId = null;
      }
    }

    function getSavedBestScore() {
      const raw = localStorage.getItem(BEST_KEY);
      if (raw === null) return null;

      const value = Number(raw);
      return Number.isFinite(value) ? value : null;
    }

    function generateTargets() {
      const values = [];
      for (let n = TARGET_MIN; n <= TARGET_MAX; n += 1) {
        values.push(n);
      }

      for (let attempt = 0; attempt < 1000; attempt += 1) {
        const shuffled = [...values].sort(() => Math.random() - 0.5);
        const selected = [];

        for (const value of shuffled) {
          const hasEnoughGap = selected.every((item) => Math.abs(item - value) >= MIN_TARGET_GAP);
          if (hasEnoughGap) selected.push(value);
          if (selected.length === TARGET_COUNT) break;
        }

        if (selected.length === TARGET_COUNT) {
          return selected.sort((a, b) => a - b);
        }
      }

      return [6, 15, 24];
    }

    function renderHome() {
      const savedBest = getSavedBestScore();
      if (savedBest !== null) {
        elements.bestDisplay.textContent = 'ベストスコア：' + formatSeconds(savedBest);
      } else {
        elements.bestDisplay.textContent = 'ベストスコア：まだありません';
      }

      const last = localStorage.getItem(LAST_KEY);
      if (last && savedBest === null) {
        elements.lastDisplay.hidden = false;
        elements.lastDisplay.textContent = '前回：' + last;
      } else {
        elements.lastDisplay.hidden = true;
        elements.lastDisplay.textContent = '';
      }
    }

    function renderTargets() {
      elements.targetList.innerHTML = '';
      game.targets.forEach((target) => {
        const span = document.createElement('span');
        span.className = 'target-pill';
        span.textContent = target + '秒';
        elements.targetList.appendChild(span);
      });
    }

    function resetTapSlots() {
      elements.tapResults.forEach((slot) => {
        slot.textContent = '--.--秒';
      });
    }

    function startGame() {
      clearAllTimers();
      game = createEmptyGame();
      game.phase = 'countdown';
      game.targets = generateTargets();

      renderTargets();
      resetTapSlots();
      elements.statusText.textContent = '準備中';
      elements.clockDisplay.className = 'clock';
      elements.clockDisplay.textContent = '3';
      elements.tapBtn.disabled = true;
      showScreen('game');

      runCountdown(3);
    }

    function runCountdown(number) {
      if (game.phase !== 'countdown') return;

      if (number > 0) {
        elements.clockDisplay.className = 'clock';
        elements.clockDisplay.textContent = String(number);
        elements.statusText.textContent = '準備中';
        countdownTimerId = setTimeout(() => runCountdown(number - 1), 1000);
        return;
      }

      elements.clockDisplay.className = 'clock note';
      elements.clockDisplay.textContent = 'スタート';
      countdownTimerId = setTimeout(beginMeasurement, 650);
    }

    function beginMeasurement() {
      if (game.phase !== 'countdown') return;

      game.phase = 'playing';
      game.startedAt = performance.now();
      elements.statusText.textContent = '計測中';
      elements.tapBtn.disabled = false;
      updateClock();
      tickTimerId = setInterval(updateClock, 30);
    }

    function updateClock() {
      if (game.phase !== 'playing') return;

      const elapsed = getElapsedSeconds();

      if (elapsed >= MAX_SECONDS) {
        finishGame('timeout');
        return;
      }

      if (elapsed <= VISIBLE_CLOCK_SECONDS) {
        elements.clockDisplay.className = 'clock';
        elements.clockDisplay.textContent = formatSeconds(elapsed);
      } else {
        elements.clockDisplay.className = 'clock note';
        elements.clockDisplay.textContent = '感覚で\n押してください';
      }

      elements.statusText.textContent = '計測中 ' + game.taps.length + ' / ' + TARGET_COUNT;
    }

    function handleTap() {
      if (game.phase !== 'playing') return;

      const elapsed = getElapsedSeconds();
      if (elapsed >= MAX_SECONDS) {
        finishGame('timeout');
        return;
      }

      if (game.taps.length >= TARGET_COUNT) return;

      game.taps.push(elapsed);
      const index = game.taps.length - 1;
      elements.tapResults[index].textContent = formatSeconds(elapsed);
      elements.statusText.textContent = '計測中 ' + game.taps.length + ' / ' + TARGET_COUNT;

      if (game.taps.length >= TARGET_COUNT) {
        finishGame('clear');
      }
    }

    function handleRetire() {
      if (game.phase === 'home' || game.phase === 'result' || game.phase === 'ending') return;
      finishGame('retire');
    }

    function finishGame(type) {
      if (game.phase === 'result' || game.phase === 'ending') return;

      const wasCountdown = game.phase === 'countdown';
      clearAllTimers();
      elements.tapBtn.disabled = true;
      game.resultType = type;
      game.endedAt = wasCountdown ? 0 : getElapsedSeconds();

      if (type === 'clear') {
        game.phase = 'ending';
        elements.statusText.textContent = '終了';
        elements.clockDisplay.className = 'clock note';
        elements.clockDisplay.textContent = '計測終了！\n結果を確認します';
        endMessageTimerId = setTimeout(() => showResult(), 1000);
        return;
      }

      showResult();
    }

    function calculateRows() {
      return game.targets.map((target, index) => {
        const tap = game.taps[index];
        const diff = Number.isFinite(tap) ? Math.abs(tap - target) : null;
        return { target, tap, diff };
      });
    }

    function calculateSenseResult(rows) {
      if (game.resultType !== 'clear') return null;

      const targetTotal = rows.reduce((sum, row) => sum + row.target, 0);
      const tapTotal = rows.reduce((sum, row) => sum + row.tap, 0);

      if (!Number.isFinite(targetTotal) || !Number.isFinite(tapTotal) || targetTotal <= 0) {
        return null;
      }

      const oneSecondSense = tapTotal / targetTotal;
      const driftPerSecond = oneSecondSense - 1;
      const averageDiff = game.finalScore / TARGET_COUNT;
      const label = getSenseLabel(driftPerSecond);

      return {
        oneSecondSense,
        driftPerSecond,
        averageDiff,
        label
      };
    }

    function getSenseLabel(driftPerSecond) {
      const abs = Math.abs(driftPerSecond);
      if (abs < 0.005) return 'ほぼぴったり';
      return driftPerSecond > 0 ? '実際より少しゆっくりめ' : '実際より少し早め';
    }

    function showResult() {
      clearAllTimers();
      game.phase = 'result';

      const rows = calculateRows();
      const completed = game.resultType === 'clear';
      const totalDiff = completed
        ? rows.reduce((sum, row) => sum + (row.diff || 0), 0)
        : null;

      game.finalScore = totalDiff;
      game.senseResult = completed ? calculateSenseResult(rows) : null;
      game.bestUpdated = false;

      if (completed && Number.isFinite(totalDiff)) {
        const savedBest = getSavedBestScore();
        if (savedBest === null || totalDiff < savedBest) {
          localStorage.setItem(BEST_KEY, String(totalDiff));
          game.bestUpdated = true;
        }
        localStorage.setItem(LAST_KEY, 'クリア');
      } else if (game.resultType === 'timeout') {
        localStorage.setItem(LAST_KEY, '時間切れ');
      } else if (game.resultType === 'retire') {
        localStorage.setItem(LAST_KEY, 'リタイア');
      }

      renderResult(rows);
      showScreen('result');
    }

    function renderResult(rows) {
      const resultLabel = getResultLabel(game.resultType);
      elements.resultState.textContent = '結果：' + resultLabel;
      elements.bestUpdate.hidden = !game.bestUpdated;

      if (game.resultType === 'clear') {
        elements.resultSummary.textContent = 'タップ回数：3回 / 3回';
        elements.finalScore.textContent = '最終スコア：' + formatSeconds(game.finalScore);
      } else if (game.resultType === 'timeout') {
        elements.resultSummary.textContent = '経過秒数：' + formatSeconds(MAX_SECONDS) + ' / タップ回数：' + game.taps.length + '回 / 3回';
        elements.finalScore.textContent = '最終スコア：時間切れ';
      } else {
        elements.resultSummary.textContent = '経過秒数：' + formatSeconds(game.endedAt) + ' / タップ回数：' + game.taps.length + '回 / 3回';
        elements.finalScore.textContent = '最終スコア：リタイア';
      }

      renderSenseScore();

      elements.resultList.innerHTML = '';
      rows.forEach((row, index) => {
        const div = document.createElement('div');
        div.className = 'result-row';
        div.innerHTML = `
          <strong>お題${index + 1}：${row.target}秒</strong>
          タップ：${Number.isFinite(row.tap) ? formatSeconds(row.tap) : '未タップ'}<br />
          差分：${Number.isFinite(row.diff) ? formatSeconds(row.diff) : 'なし'}
        `;
        elements.resultList.appendChild(div);
      });

      latestShareText = buildResultShareText(rows);
    }

    function renderSenseScore() {
      if (!game.senseResult) {
        elements.senseScore.hidden = true;
        elements.senseScore.innerHTML = '';
        return;
      }

      const sense = game.senseResult;
      const driftPrefix = sense.driftPerSecond >= 0 ? '+' : '';
      elements.senseScore.hidden = false;
      elements.senseScore.innerHTML = `
        あなたの1秒感覚：${sense.oneSecondSense.toFixed(2)}秒<br />
        1秒あたりのズレ：${driftPrefix}${sense.driftPerSecond.toFixed(3)}秒
        <small>平均ズレ：${formatSeconds(sense.averageDiff)} / ${sense.label}</small>
      `;
    }

    function getResultLabel(type) {
      if (type === 'clear') return 'クリア';
      if (type === 'timeout') return '時間切れ';
      return 'リタイア';
    }

    function buildResultShareText(rows) {
      const label = getResultLabel(game.resultType);
      if (game.resultType === 'clear') {
        return [
          GAME_TITLE + ' 結果',
          '結果：クリア',
          'お題：' + game.targets.map((target) => target + '秒').join(' / '),
          'タップ：' + game.taps.map((tap) => formatSeconds(tap)).join(' / '),
          '最終スコア：' + formatSeconds(game.finalScore),
          game.senseResult
            ? 'あなたの1秒感覚：' + game.senseResult.oneSecondSense.toFixed(2) + '秒（' + game.senseResult.label + '）'
            : ''
        ].filter(Boolean).join('\n');
      }

      return [
        GAME_TITLE + ' 結果',
        '結果：' + label,
        '経過秒数：' + formatSeconds(game.resultType === 'timeout' ? MAX_SECONDS : game.endedAt),
        'タップ回数：' + game.taps.length + '回 / 3回'
      ].join('\n');
    }

    function buildGameShareText() {
      return [GAME_TITLE, GAME_DESCRIPTION, GAME_URL_PLACEHOLDER].join('\n');
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        }
        showToast('クリップボードにコピーしました');
      } catch (error) {
        showToast('コピーできませんでした');
      }
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add('show');
      if (toastTimerId !== null) clearTimeout(toastTimerId);
      toastTimerId = setTimeout(() => {
        elements.toast.classList.remove('show');
      }, 1000);
    }

    elements.startBtn.addEventListener('click', startGame);
    elements.retryBtn.addEventListener('click', startGame);
    elements.finishBtn.addEventListener('click', () => {
      clearAllTimers();
      game = createEmptyGame();
      renderHome();
      showScreen('home');
    });
    elements.tapBtn.addEventListener('click', handleTap);
    elements.retireBtn.addEventListener('click', handleRetire);
    elements.shareGameBtn.addEventListener('click', () => copyText(buildGameShareText()));
    elements.shareResultBtn.addEventListener('click', () => copyText(latestShareText));

    renderHome();
  </script>
</body>
</html>
