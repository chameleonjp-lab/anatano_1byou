<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="gameTitle">あなたの1秒って</title>
  <!-- version: v1.16 layout-fix / ranking / single index.html -->
  <style>
    :root {
      --bg: #f5f2ea;
      --card: #fffdf7;
      --text: #2d2a24;
      --muted: #776f63;
      --line: #e4dccd;
      --accent: #2f6f73;
      --accent-dark: #24575a;
      --danger: #b84a4a;
      --danger-dark: #8f3636;
      --shadow: 0 12px 30px rgba(57, 49, 35, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #fff9e9 0%, var(--bg) 45%, #e8efe9 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    html {
      min-height: 100svh;
      scroll-behavior: auto;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100svh;
      padding: 4px 10px 8px;
      overflow-x: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 430px);
      min-height: calc(100svh - 12px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .screen.active {
      display: block;
    }

    .card {
      width: 100%;
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid rgba(228, 220, 205, 0.95);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px 16px;
    }

    body[data-screen="home"],
    body[data-screen="game"] {
      overflow: hidden;
    }

    body[data-screen="result"] {
      overflow-y: auto;
    }

    .home-card {
      height: calc(100svh - 12px);
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      padding: 15px 14px;
    }

    .home-card .title {
      font-size: clamp(1.85rem, 8vw, 2.55rem);
      margin-bottom: 10px;
    }

    .home-card .best-box {
      margin: 9px 0;
      padding: 10px;
    }

    .home-card .lead {
      line-height: 1.55;
      font-size: clamp(0.92rem, 3.7vw, 1rem);
      margin: 12px 0;
    }

    .home-card .notice {
      line-height: 1.45;
      font-size: 0.78rem;
      padding-top: 10px;
      margin-top: 10px;
    }

    .home-card .button-stack {
      gap: 7px;
      margin-top: 10px;
    }

    .home-card .btn {
      padding: 13px 16px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .title {
      font-size: clamp(2rem, 9vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 16px;
    }

    .lead {
      color: var(--text);
      line-height: 1.75;
      font-size: 1rem;
      text-align: center;
      margin: 16px 0;
    }

    .notice {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.82rem;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 14px;
    }

    .best-box,
    .score-box {
      border: 1px solid var(--line);
      background: #fff8e9;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      font-weight: 800;
      margin: 12px 0;
    }

    .button-stack {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 15px 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 111, 115, 0.18);
      transition: transform 0.08s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .btn:active {
      transform: translateY(2px) scale(0.985);
      filter: brightness(0.96);
    }

    .btn.primary {
      color: #fff;
      background: var(--accent);
    }

    .btn.primary:active {
      background: var(--accent-dark);
    }

    .btn.secondary {
      color: var(--accent-dark);
      background: #e7f1ef;
      box-shadow: none;
    }

    .btn.danger {
      color: #fff;
      background: var(--danger);
      box-shadow: none;
    }

    .btn.danger:active {
      background: var(--danger-dark);
    }

    .btn.tap {
      min-height: 62px;
      font-size: 1.18rem;
      border-radius: 18px;
      box-shadow: 0 10px 18px rgba(47, 111, 115, 0.22);
      margin-top: 0;
    }

    .btn.tap:active {
      transform: translateY(3px) scale(0.975);
      box-shadow: 0 4px 10px rgba(47, 111, 115, 0.22);
      filter: brightness(0.95);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: default;
      transform: none;
    }

    .game-card {
      height: calc(100svh - 12px);
      min-height: 0;
      max-height: 650px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .status {
      color: var(--muted);
      font-weight: 800;
      font-size: 0.92rem;
    }

    .retire-btn {
      border: 0;
      color: #fff;
      background: var(--danger);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      min-width: 82px;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .retire-btn:active {
      transform: translateY(2px) scale(0.98);
      filter: brightness(0.94);
    }

    .target-area {
      background: #fff8e9;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;
      text-align: center;
    }

    .label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .targets {
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: nowrap;
      font-weight: 900;
      font-size: clamp(1.12rem, 5.5vw, 1.55rem);
    }

    .target-pill {
      background: #fffdf7;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      min-width: 0;
      flex: 1;
      max-width: 104px;
    }

    .clock-area {
      flex: 0 0 clamp(96px, 22svh, 150px);
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 0;
    }

    .clock {
      font-size: clamp(2.25rem, 13vw, 4.2rem);
      font-weight: 900;
      line-height: 1.05;
      white-space: pre-line;
    }

    .clock.note {
      font-size: clamp(1.25rem, 7vw, 2rem);
      color: var(--accent-dark);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .tap-slot {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 12px;
      padding: 6px 3px;
      text-align: center;
      min-width: 0;
    }

    .tap-slot small {
      display: block;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.72rem;
      margin-bottom: 3px;
    }

    .tap-slot strong {
      display: block;
      font-size: clamp(0.95rem, 4.4vw, 1.25rem);
      word-break: keep-all;
    }

    .result-title {
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      text-align: center;
      margin-bottom: 12px;
    }

    .result-state {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .result-list {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }

    .result-row {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 16px;
      padding: 12px;
      line-height: 1.6;
    }

    .result-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .final-score {
      background: #e7f1ef;
      border: 1px solid #c6dedb;
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      font-size: 1.18rem;
      font-weight: 900;
      margin: 14px 0;
    }

    .sense-score {
      border: 1px solid #eadbb7;
      background: #fff8e8;
      border-radius: 18px;
      padding: 13px;
      text-align: center;
      line-height: 1.55;
      font-weight: 800;
      margin: 12px 0;
    }

    .sense-score small {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .best-update {
      color: var(--accent-dark);
      text-align: center;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(16px);
      background: rgba(45, 42, 36, 0.94);
      color: #fff;
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    .player-box,
    .stats-box,
    .ranking-status {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1.45;
      margin: 8px 0;
    }

    .ranking-area {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }

    .ranking-card {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 16px;
      padding: 12px;
    }

    .ranking-card h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      text-align: center;
    }

    .ranking-list {
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      border-top: 1px solid rgba(228, 220, 205, 0.7);
      padding-top: 6px;
      line-height: 1.35;
    }

    .ranking-row:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .ranking-rank,
    .ranking-score {
      font-weight: 900;
      white-space: nowrap;
    }

    .ranking-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(45, 42, 36, 0.42);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .name-modal {
      width: min(100%, 390px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px 16px;
    }

    .name-modal h2 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 1.35rem;
    }

    .name-modal p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 12px;
    }

    .name-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 12px;
      font: inherit;
      font-size: 1rem;
      background: #fffdf7;
      color: var(--text);
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    .name-error {
      min-height: 1.4em;
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 800;
      text-align: center;
      margin: 8px 0 0;
    }


    @supports not (height: 100svh) {
      html,
      body {
        min-height: 100vh;
      }

      .app {
        min-height: calc(100vh - 18px);
      }

      .game-card,
      .home-card {
        height: calc(100vh - 18px);
      }
    }

    @media (max-height: 700px) {
      .home-card {
        justify-content: flex-start;
        padding: 12px;
      }

      .home-card .title {
        font-size: clamp(1.65rem, 7.2vw, 2.2rem);
        margin-bottom: 8px;
      }

      .home-card .best-box {
        padding: 8px;
        margin: 8px 0;
      }

      .home-card .lead {
        line-height: 1.46;
        font-size: 0.9rem;
        margin: 9px 0;
      }

      .home-card .notice {
        line-height: 1.38;
        font-size: 0.72rem;
        padding-top: 8px;
        margin-top: 8px;
      }

      .home-card .button-stack {
        gap: 6px;
        margin-top: 8px;
      }

      .home-card .btn {
        padding: 11px 14px;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 6px 8px 8px;
      }

      .card {
        border-radius: 18px;
        padding: 14px 12px;
      }

      .game-card,
      .home-card {
        height: calc(100svh - 10px);
      }

      .game-card {
        padding: 8px;
      }

      .results-grid {
        gap: 6px;
      }

      .target-pill {
        padding: 5px 10px;
      }
    }
  
    .lab-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--accent-dark);
    }


    .result-card {
      margin-top: 0;
      padding-top: 14px;
    }

    .result-card .result-title {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .result-card .result-state {
      margin-bottom: 10px;
    }


    body[data-screen="home"],body[data-screen="game"] {overflow-y:auto;}
    .audio-controls{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px;margin:8px 0;}
    .audio-controls button{grid-column:1/-1;min-height:44px;}
    .audio-controls input{min-width:0;min-height:44px;width:100%;}
    .name-home {margin:8px 0;text-align:left;}
    .name-home .notice {margin-top:6px;padding:0;}
    .name-home .name-error {min-height:0;margin:4px 0;}
    .language-control {display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;}
    .language-control select {font:inherit;font-size:16px;min-height:44px;max-width:70%;padding:6px;}
    .home-card {height:auto;min-height:calc(100svh - 12px);overflow:visible;}
    .title,.result-title,.btn,.clock.note {overflow-wrap:anywhere;white-space:normal;}
    .title {line-height:1.15;}
    .clock.note {white-space:pre-line;font-size:clamp(1.2rem,6vw,2rem);}
    .ranking-name {overflow-wrap:anywhere;min-width:0;}
    @media(max-height:700px){.game-card{min-height:420px;height:auto;}.home-card{height:auto;}}
</style>
</head>
<body data-screen="home">
  <main class="app" aria-live="polite">
    <section id="homeScreen" class="screen active">
      <div class="card home-card">
        <h1 class="title" data-i18n="gameTitle">あなたの1秒って</h1>
        <label class="language-control"><span data-i18n="language">言語</span><select id="languageSelect" aria-label="言語" data-i18n="language" data-i18n-attr="aria-label"></select></label>
        <div id="bestDisplay" class="best-box">ベストスコア（合計誤差）：まだありません</div>
        <div class="name-home">
          <label for="playerNameInput" data-i18n="nameTitle">名前を入力</label>
          <input id="playerNameInput" data-i18n="namePlaceholder" data-i18n-attr="placeholder" class="name-input" type="text" autocomplete="nickname" aria-describedby="nameDisclosure nameError" />
          <p id="nameDisclosure" class="notice" data-i18n="nameDisclosure"></p>
          <div id="nameError" class="name-error" role="status"></div>
        </div>
        <div id="playerNameDisplay" class="player-box" hidden></div>
        <div id="gameStats" class="stats-box" hidden></div>
        <p class="lead" data-i18n="intro"></p>
        <p id="lastDisplay" class="notice" hidden></p>
        <p class="notice" data-i18n="localNotice"></p>
        <div class="audio-controls">
          <button id="soundToggle" class="btn secondary" type="button" aria-pressed="true"></button>
          <label for="soundVolume" data-i18n="volume"></label><input id="soundVolume" type="range" min="0" max="1" step="0.05" />
        </div>
        <div class="button-stack">
          <button id="startBtn" data-i18n="start" class="btn primary" type="button">ゲームスタート</button>
          <button id="shareGameBtn" data-i18n="shareX" class="btn secondary common-x-share" type="button">Xでシェア</button><a class="common-ranking-link" data-i18n="ranking" href="https://chameleonjp-lab.github.io/chameleonjp_lab/ranking.html?game=anatano_1byou">ランキング</a>
          <a class="btn secondary lab-button" data-i18n="otherGames" href="https://chameleonjp-lab.github.io/chameleonjp_lab/" target="_self" rel="noopener">他のゲームで遊ぶ</a>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="card game-card">
        <div class="top-bar">
          <div id="statusText" data-i18n="preparing" class="status">準備中</div>
          <button id="retireBtn" data-i18n="retire" class="retire-btn" type="button">リタイア</button>
        </div>

        <div class="target-area">
          <div class="label" data-i18n="targets">お題</div>
          <div id="targetList" class="targets"></div>
        </div>

        <div class="clock-area">
          <div id="clockDisplay" class="clock">3</div>
        </div>

        <div class="results-grid" aria-label="タップ結果" data-i18n="resultsAria" data-i18n-attr="aria-label">
          <div class="tap-slot"><small data-i18n="attempt" data-i18n-params='{"n":1}'>1回目</small><strong id="tapResult0">--.--秒</strong></div>
          <div class="tap-slot"><small data-i18n="attempt" data-i18n-params='{"n":2}'>2回目</small><strong id="tapResult1">--.--秒</strong></div>
          <div class="tap-slot"><small data-i18n="attempt" data-i18n-params='{"n":3}'>3回目</small><strong id="tapResult2">--.--秒</strong></div>
        </div>

        <button id="tapBtn" data-i18n="tap" class="btn primary tap" type="button" disabled>ここで押す</button>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card result-card">
        <h2 class="result-title" data-i18n="gameTitle">あなたの1秒って</h2>
        <div id="resultState" class="result-state">結果：クリア</div>
        <div id="resultSummary" class="score-box"></div>
        <div id="resultList" class="result-list"></div>
        <div id="finalScore" class="final-score"></div>
        <div id="senseScore" class="sense-score" hidden></div>
        <div id="bestUpdate" data-i18n="bestUpdated" class="best-update" hidden>ベスト更新！</div>
        <div id="rankingStatus" class="ranking-status" role="status" hidden></div>
        <button id="retrySendBtn" class="btn secondary" type="button" data-i18n="retrySend" hidden></button>
        <div id="rankingReadStatus" class="ranking-status" role="status" hidden></div>
        <button id="retryRankingBtn" class="btn secondary" type="button" data-i18n="retryRanking" hidden></button>
        <div class="button-stack">
          <button id="shareResultBtn" data-i18n="shareX" class="btn secondary common-x-share" type="button">Xでシェア</button><a class="common-ranking-link" data-i18n="ranking" href="https://chameleonjp-lab.github.io/chameleonjp_lab/ranking.html?game=anatano_1byou">ランキング</a>
          <button id="retryBtn" data-i18n="retry" class="btn primary" type="button">もう一度プレイ</button>
          <button id="finishBtn" data-i18n="finish" class="btn secondary" type="button">ゲーム終了</button>
        </div>
        <div id="rankingArea" class="ranking-area" hidden>
          <div class="ranking-card">
            <h3 data-i18n="bestRanking">ベストランキング</h3>
            <div id="bestRankingList" class="ranking-list"></div>
          </div>
          <div class="ranking-card">
            <h3 data-i18n="firstRanking">初回ランキング</h3>
            <div id="firstRankingList" class="ranking-list"></div>
          </div>
        </div>

      </div>
    </section>
  </main>


  <div id="toast" data-i18n="clipboardCopied" class="toast">クリップボードにコピーしました</div>

  <style>
button.common-x-share { background:#000 !important; color:#fff !important; border:1px solid #555; white-space:normal; overflow-wrap:anywhere; min-height:44px; padding:12px 16px; line-height:1.4; }
.common-ranking-link { display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; min-height:44px; padding:12px 16px; border:1px solid currentColor; border-radius:10px; color:inherit; text-decoration:none; white-space:normal; overflow-wrap:anywhere; line-height:1.4; }

<script id="localization">
(() => {
  'use strict';
  const catalogs = JSON.parse(document.getElementById('locale-catalogs').textContent);
  const languageNames = {ja:'日本語',en:'English',es:'Español','pt-BR':'Português (Brasil)','zh-Hans':'简体中文',fr:'Français',de:'Deutsch',ko:'한국어',ru:'Русский',it:'Italiano','zh-Hant':'繁體中文',id:'Bahasa Indonesia',tr:'Türkçe',vi:'Tiếng Việt',th:'ไทย'};
  const key = 'anatano_1byou-language';
  function normalize(value) {
    const id=String(value||'').replaceAll('_','-').toLowerCase();
    const exact=Object.keys(catalogs).find(lang=>lang.toLowerCase()===id);
    if(exact)return exact;
    if(id==='zh'||id.startsWith('zh-'))return /hant|tw|hk|mo/.test(id)?'zh-Hant':'zh-Hans';
    if(id==='pt'||id.startsWith('pt-'))return 'pt-BR';
    const base=id.split('-')[0];return Object.hasOwn(catalogs,base)?base:null;
  }
  let saved=null;try{saved=localStorage.getItem(key);}catch{}
  let language=normalize(saved)||(navigator.languages||[navigator.language]).map(normalize).find(Boolean)||'en';
  const t=(name,params={})=>String(catalogs[language]?.[name]??catalogs.en[name]??name).replace(/\{(\w+)\}/g,(whole,id)=>Object.hasOwn(params,id)?String(params[id]):whole);
  function render() {
    document.documentElement.lang=language;
    document.querySelectorAll('[data-i18n]').forEach(element=>{
      let params={};try{params=JSON.parse(element.dataset.i18nParams||'{}');}catch{}
      const value=t(element.dataset.i18n,params);
      if(element.dataset.i18nAttr)element.setAttribute(element.dataset.i18nAttr,value);else element.textContent=value;
    });
    const select=document.getElementById('languageSelect');if(select)select.value=language;
  }
  function setLanguage(value) {
    const next=normalize(value)||'en';if(next===language)return;
    language=next;try{localStorage.setItem(key,language);}catch{}
    render();window.dispatchEvent(new CustomEvent('gamelanguagechange'));
  }
  function text(element,name,params={}) {
    element.dataset.i18n=name;element.dataset.i18nParams=JSON.stringify(params);element.textContent=t(name,params);
  }
  const select=document.getElementById('languageSelect');
  if(select&&typeof document.createElement==='function'){
    for(const [value,label] of Object.entries(languageNames)){const option=document.createElement('option');option.value=value;option.textContent=label;select.appendChild(option);}
    select.addEventListener('change',()=>setLanguage(select.value));
  }
  window.gameI18n={t,text,render,setLanguage,normalize,get language(){return language;}};
  render();
})();
</script>

<script>
(() => {
  'use strict';
  const dialog = document.getElementById('commonShareFallback');
  const field = document.getElementById('commonShareText');
  const status = document.getElementById('commonShareStatus');
  window.openGameShareX = (text) => {
    const body = String(text);
    const intent = new URL('https://x.com/intent/post');
    intent.searchParams.set('text', body);
    let popup;
    try {
      popup = window.open('', '_blank');
      if (popup) {
        popup.opener = null;
        popup.location.replace(intent.href);
        return;
      }
    } catch (_) {
      try { if (popup) popup.close(); } catch (_) {}
    }
    field.value = body;
    delete status.dataset.i18n; status.textContent = '';
    if (!dialog.open) dialog.showModal();
    field.focus();
    field.select();
  };
  document.getElementById('commonShareCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(field.value);
      window.gameI18n.text(status,'copied');
    } catch (_) {
      field.focus();
      field.select();
      window.gameI18n.text(status,'copyManual');
    }
  });
  document.getElementById('commonShareClose').addEventListener('click', () => dialog.close());
})();
</script>

<script id="game-audio">
(() => {
  'use strict';
  const read=key=>{try{return localStorage.getItem(key);}catch{return null;}};
  const write=(key,value)=>{try{localStorage.setItem(key,String(value));}catch{}};
  let enabled=read('anatano_1byou-sound')!=='off';
  const saved=read('anatano_1byou-volume');
  let volume=saved!==null&&saved.trim()!==''&&Number.isFinite(Number(saved))&&Number(saved)>=0&&Number(saved)<=1?Number(saved):0.3;
  let context=null,generation=0;
  const voices=new Set(),lastPlayed=new Map();
  function stop(){generation++;for(const voice of [...voices]){try{voice.stop();}catch{}}voices.clear();}
  async function play(event) {
    if(!enabled||volume===0||document.hidden)return;
    const requestedAt=performance.now(),requestGeneration=generation;
    if(requestedAt-(lastPlayed.get(event)??-Infinity)<80)return;
    lastPlayed.set(event,requestedAt);
    try{
      const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
      context??=new Audio();
      if(context.state!=='running'){void context.resume().catch(()=>{});return;}
      if(context.state!=='running'||!enabled||volume===0||document.hidden||requestGeneration!==generation||performance.now()-requestedAt>250)return;
      // A completion tone replaces the final tap tone; no timer/tick cue is emitted.
      if(['finish','retire','best'].includes(event))stop();
      if(voices.size>=8)return;
      const oscillator=context.createOscillator(),gain=context.createGain();
      const frequency={start:440,tap:660,finish:880,retire:220,best:1100}[event];if(!frequency)return;
      const duration=event==='tap'?0.07:0.16;
      oscillator.type='sine';oscillator.frequency.value=frequency;
      gain.gain.setValueAtTime(0.0001,context.currentTime);
      gain.gain.linearRampToValueAtTime(Math.max(0.0001,volume*volume*0.3),context.currentTime+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001,context.currentTime+duration);
      oscillator.connect(gain);gain.connect(context.destination);voices.add(oscillator);
      oscillator.onended=()=>{voices.delete(oscillator);oscillator.disconnect();gain.disconnect();};
      oscillator.start();oscillator.stop(context.currentTime+duration+0.01);
    }catch{/* Audio permission or device failure never blocks the game. */}
  }
  window.gameAudio={play,stop,get enabled(){return enabled},get volume(){return volume},
    setEnabled(value){enabled=Boolean(value);write('anatano_1byou-sound',enabled?'on':'off');if(!enabled)stop();},
    setVolume(value){const next=Number(value);if(!Number.isFinite(next))return;volume=Math.max(0,Math.min(1,next));write('anatano_1byou-volume',volume);if(volume===0)stop();}
  };
  window.addEventListener('pagehide',stop);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
})();
</script>
<script id="score-queue">
(function (root) {
  'use strict';
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  const copy = value => JSON.parse(JSON.stringify(value));
  function createScoreQueue({gameSlug, storage = null, send, onChange = () => {}, uuid = () => root.crypto.randomUUID()}) {
    const prefix = gameSlug + ':score-pending:v1:';
    const memory = new Map();
    let operation = null;
    function valid(item) {
      const p = item?.payload;
      return UUID.test(item?.id || '') && p?.p_submission_id === item.id && p.p_game_slug === gameSlug &&
        typeof p.p_display_name === 'string' && p.p_display_name.trim() !== '' &&
        typeof p.p_client_version === 'string' && Number.isInteger(p.p_score) && p.p_score >= 0;
    }
    function save(item) {
      memory.set(item.id, copy(item));
      try { storage?.setItem(prefix + item.id, JSON.stringify(item)); } catch { /* Keep this session usable. */ }
      return item;
    }
    function list() {
      try {
        if (storage) for (let i = 0; i < storage.length; i++) {
          const key = storage.key(i);
          if (!key?.startsWith(prefix)) continue;
          try { const item = JSON.parse(storage.getItem(key)); if (valid(item)) memory.set(item.id, item); } catch { /* Preserve malformed data without sending it. */ }
        }
      } catch { /* Memory contains records saved in this session. */ }
      return [...memory.values()].map(copy).sort((a,b) => a.createdAt - b.createdAt || a.id.localeCompare(b.id));
    }
    function notify(item, receipt = null) { try { onChange(copy(item), receipt && copy(receipt)); } catch {} }
    function capture(name, clientVersion) {
      if (!name?.trim()) return null;
      try { const id = uuid(); if (!UUID.test(id)) return null; return Object.freeze({id, name:name.trim(), clientVersion}); }
      catch { return null; }
    }
    function enqueue(play, score, presentation = null) {
      if (!play) return null;
      const existing = list().find(item => item.id === play.id);

    function createEmptyGame() {
      return {
        phase: 'home',
        targets: [],
        taps: [],

    function roundToTwo(value) {
      if (!Number.isFinite(value)) return null;
      return Math.round((value + Number.EPSILON) * 100) / 100;
    }

    function formatSeconds(value) {
      const safeValue = Number.isFinite(value) ? Math.max(0, value) : 0;
      return t('seconds',{value:safeValue.toFixed(2)});
    }

    function getElapsedSeconds() {
      if (!game.startedAt) return 0;

    function safeGetItem(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function safeSetItem(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        // localStorageが使えない環境でも、ゲーム本体は止めない。
      }
    }

    function clearAllTimers() {
      if (tickTimerId !== null) {
        clearInterval(tickTimerId);
        tickTimerId = null;
      }
      if (countdownTimerId !== null) {
        clearTimeout(countdownTimerId);
        countdownTimerId = null;
      }
      if (endMessageTimerId !== null) {
        clearTimeout(endMessageTimerId);
        endMessageTimerId = null;
      }
    }

    function getSavedBestScore() {
      const raw = safeGetItem(BEST_KEY);
      if (raw === null) return null;

      const value = Number(raw);
      return Number.isFinite(value) ? value : null;
    }

    function getPlayerName() {
      const raw = safeGetItem(PLAYER_NAME_KEY) ?? safeGetItem(LEGACY_PLAYER_NAME_KEY);
      return raw ? Array.from(raw.trim()).slice(0, 20).join('') : '';
    }

    function savePlayerName(name) {
      safeSetItem(PLAYER_NAME_KEY, Array.from(name.trim()).slice(0, 20).join(''));
    }

    function getSupabasePublishableKey() {
      return String(SUPABASE_PUBLISHABLE_KEY || '').trim();
    }

    function hasSupabaseConfig() {
      const key = getSupabasePublishableKey();
      return Boolean(
        SUPABASE_URL &&
        key &&
        !key.includes('ここに') &&
        !key.includes('Publishable key') &&
        !key.includes('YOUR_') &&
        !key.includes('REPLACE_')
      );
    }

    function generateTargets() {
      const values = [];
      for (let n = TARGET_MIN; n <= TARGET_MAX; n += 1) {
        values.push(n);
      }

      for (let attempt = 0; attempt < 1000; attempt += 1) {
        const shuffled = [...values].sort(() => Math.random() - 0.5);
        const selected = [];

        for (const value of shuffled) {
          const hasEnoughGap = selected.every((item) => Math.abs(item - value) >= MIN_TARGET_GAP);
          if (hasEnoughGap) selected.push(value);
          if (selected.length === TARGET_COUNT) break;
        }

        if (selected.length === TARGET_COUNT) {
          return selected.sort((a, b) => a - b);
        }
      }

      return [6, 15, 24];
    }

    function renderHome() {
      const savedBest = getSavedBestScore();
      if (savedBest !== null) {
        setText(elements.bestDisplay,'bestScore',{score:savedBest.toFixed(2)});
      } else {
        setText(elements.bestDisplay,'bestNone');
      }

      const playerName = getPlayerName();
      if (playerName) {
        elements.playerNameDisplay.hidden = false;
        setText(elements.playerNameDisplay,'playerName',{name:playerName});
      } else {
        elements.playerNameDisplay.hidden = true;
        elements.playerNameDisplay.textContent = '';
      }

      const last = safeGetItem(LAST_KEY);
      if (last && savedBest === null) {
        elements.lastDisplay.hidden = false;
        setText(elements.lastDisplay,'lastResult',{result:getResultLabel({'クリア':'clear','時間切れ':'timeout','リタイア':'retire'}[last]||last)});
      } else {
        elements.lastDisplay.hidden = true;
        elements.lastDisplay.textContent = '';
      }

      refreshGameStats();
    }

    function renderTargets() {
      elements.targetList.innerHTML = '';
      game.targets.forEach((target) => {
        const span = document.createElement('span');
        span.className = 'target-pill';
        setText(span,'seconds',{value:target});
        elements.targetList.appendChild(span);
      });
    }

    function resetTapSlots() {
      elements.tapResults.forEach((slot) => {
        setText(slot,'seconds',{value:'--.--'});
      });

    function requestStartGame() {
      const name=elements.playerNameInput.value.trim();
      if(Array.from(name).length>20){setText(elements.nameError,'nameTooLong');elements.playerNameInput.focus();return;}
      savePlayerName(name);
      delete elements.nameError.dataset.i18n;elements.nameError.textContent='';
      elements.playerNameInput.blur();
      startGame(name);
    }

    function startGame(playerName) {
      clearAllTimers();
      game = createEmptyGame();
      game.phase = 'countdown';
      game.playerName = playerName || '';
      game.play = scoreQueue.capture(game.playerName, CLIENT_VERSION);
      resultToken += 1; rankingRequestId += 1;
      safeSetItem(RESULT_KEY, '');
      game.targets = generateTargets();

      renderTargets();
      resetTapSlots();
      setText(elements.statusText,'preparing');
      elements.clockDisplay.className = 'clock';
      delete elements.clockDisplay.dataset.i18n; elements.clockDisplay.textContent = '3';
      elements.tapBtn.disabled = true;
      showScreen('game');

      void window.gameAudio.play('start');
      runCountdown(3);
    }

    function runCountdown(number) {
      if (game.phase !== 'countdown') return;

      if (number > 0) {
        elements.clockDisplay.className = 'clock';
        delete elements.clockDisplay.dataset.i18n; elements.clockDisplay.textContent = String(number);
        setText(elements.statusText,'preparing');
        countdownTimerId = setTimeout(() => runCountdown(number - 1), 1000);
        return;
      }

      elements.clockDisplay.className = 'clock note';
      setText(elements.clockDisplay,'go');
      countdownTimerId = setTimeout(beginMeasurement, 650);
    }

    function beginMeasurement() {
      if (game.phase !== 'countdown') return;

      game.phase = 'playing';
      game.startedAt = performance.now();
      setText(elements.statusText,'measuring',{count:0,total:TARGET_COUNT});
      elements.tapBtn.disabled = false;
      updateClock();
      tickTimerId = setInterval(updateClock, 30);
    }

    function updateClock() {
      if (game.phase !== 'playing') return;

      const elapsed = getElapsedSeconds();

      if (elapsed >= MAX_SECONDS) {
        finishGame('timeout');
        return;
      }

      if (elapsed <= VISIBLE_CLOCK_SECONDS) {
        elements.clockDisplay.className = 'clock';
        setText(elements.clockDisplay,'seconds',{value:elapsed.toFixed(2)});
      } else {
        elements.clockDisplay.className = 'clock note';
        setText(elements.clockDisplay,'feelTime');
      }

      setText(elements.statusText,'measuring',{count:game.taps.length,total:TARGET_COUNT});
    }

    function handleTap() {
      if (game.phase !== 'playing') return;

      const elapsed = getElapsedSeconds();
      if (elapsed >= MAX_SECONDS) {
        finishGame('timeout');
        return;
      }

      if (game.taps.length >= TARGET_COUNT) return;

      game.taps.push(elapsed);
      if(game.taps.length<TARGET_COUNT)void window.gameAudio.play('tap');
      const index = game.taps.length - 1;
      setText(elements.tapResults[index],'seconds',{value:elapsed.toFixed(2)});
      setText(elements.statusText,'measuring',{count:game.taps.length,total:TARGET_COUNT});

      if (game.taps.length >= TARGET_COUNT) {
        finishGame('clear');
      }
    }

    function handleRetire() {
      if (game.phase === 'home' || game.phase === 'result' || game.phase === 'ending') return;
      finishGame('retire');
    }

    function finishGame(type) {
      if (game.phase === 'result' || game.phase === 'ending') return;

      const wasCountdown = game.phase === 'countdown';
      clearAllTimers();
      elements.tapBtn.disabled = true;
      game.resultType = type;
      void window.gameAudio.play(type==='clear'?'finish':'retire');
      game.endedAt = wasCountdown ? 0 : getElapsedSeconds();
      finalizeResult();

      if (type === 'clear') {
        game.phase = 'ending';
        setText(elements.statusText,'ended');
        elements.clockDisplay.className = 'clock note';
        setText(elements.clockDisplay,'measurementEnded');
        endMessageTimerId = setTimeout(() => showResult(), 1000);
        return;
      }

      showResult();
    }

    function calculateRows() {
      return game.targets.map((target, index) => {
        const rawTap = game.taps[index];
        const tap = Number.isFinite(rawTap) ? roundToTwo(rawTap) : null;
        const diff = Number.isFinite(tap) ? roundToTwo(Math.abs(tap - target)) : null;
        return { target, tap, diff };
      });
    }

    function calculateSenseResult(rows) {
      if (game.resultType !== 'clear') return null;

      const targetTotal = rows.reduce((sum, row) => sum + row.target, 0);
      const tapTotal = rows.reduce((sum, row) => sum + row.tap, 0);

      if (!Number.isFinite(targetTotal) || !Number.isFinite(tapTotal) || targetTotal <= 0) {
        return null;
      }

      const oneSecondSense = tapTotal / targetTotal;
      const driftPerSecond = oneSecondSense - 1;
      const averageDiff = roundToTwo(game.finalScore / TARGET_COUNT);
      const label = getSenseLabel(driftPerSecond);

      return {
        oneSecondSense,
        driftPerSecond,
        averageDiff,
        label
      };
    }

    function getSenseLabel(driftPerSecond) {
      const abs = Math.abs(driftPerSecond);
      if (abs < 0.005) return 'senseExact';
      return driftPerSecond > 0 ? 'senseSlow' : 'senseFast';
    }

    function finalizeResult() {
      if(game.finalized)return;
      const rows = calculateRows();
      const completed = game.resultType === 'clear';
      const totalDiff = completed
        ? roundToTwo(rows.reduce((sum, row) => sum + (row.diff || 0), 0))
        : null;

      game.finalScore = totalDiff;
      game.senseResult = completed ? calculateSenseResult(rows) : null;
      game.bestUpdated = false;

      if (completed && Number.isFinite(totalDiff)) {
        const savedBest = getSavedBestScore();
        if (savedBest === null || totalDiff < savedBest) {
          safeSetItem(BEST_KEY, String(totalDiff));
          game.bestUpdated = true;
        }
        safeSetItem(LAST_KEY, 'クリア');
      } else if (game.resultType === 'timeout') {
        safeSetItem(LAST_KEY, '時間切れ');
      } else if (game.resultType === 'retire') {
        safeSetItem(LAST_KEY, 'リタイア');
      }

      game.finalized=true;
      game.submissionStatus = completed ? (game.playerName ? (game.play ? 'pending' : 'failed') : 'guest') : 'notSubmitted';
      const snapshot={...game,phase:'result'};
      // Persist at the final tap, before the existing one-second result animation.
      safeSetItem(RESULT_KEY,JSON.stringify(snapshot));
      if(completed&&game.playerName&&game.play){
        try{scoreQueue.enqueue(game.play,scoreSecondsToSubmit(game.finalScore),snapshot);}
        catch{game.submissionStatus='failed';safeSetItem(RESULT_KEY,JSON.stringify({...game,phase:'result'}));}
      }
    }
    function showResult() {

    }

    function renderResult(rows) {
      const resultLabel = getResultLabel(game.resultType);
      setText(elements.resultState,'result',{result:resultLabel});
      elements.bestUpdate.hidden = !game.bestUpdated;

      if (game.resultType === 'clear') {
        setText(elements.resultSummary,'tapCount',{count:3,total:3});
        setText(elements.finalScore,'finalScore',{score:game.finalScore.toFixed(2)});
      } else if (game.resultType === 'timeout') {
        setText(elements.resultSummary,'elapsedTaps',{seconds:MAX_SECONDS.toFixed(2),count:game.taps.length,total:3});
        setText(elements.finalScore,'finalState',{result:t('timeout')});
      } else {
        setText(elements.resultSummary,'elapsedTaps',{seconds:game.endedAt.toFixed(2),count:game.taps.length,total:3});
        setText(elements.finalScore,'finalState',{result:t('retire')});

      renderSenseScore();

        const diff=document.createElement('div');setText(diff,'rowDiff',{value:Number.isFinite(row.diff)?formatSeconds(row.diff):t('none')});
        div.append(target,tap,diff);
        elements.resultList.appendChild(div);
      });

      latestShareText = buildResultShareText(rows);
    }

    function renderSenseScore() {
      if (!game.senseResult) {
        elements.senseScore.hidden = true;
        elements.senseScore.innerHTML = '';
        return;
      }

      const sense = game.senseResult;
      const driftPrefix = sense.driftPerSecond >= 0 ? '+' : '';
      elements.senseScore.hidden = false;
      elements.senseScore.replaceChildren();
      for(const [key,params,tag] of [
        ['senseOne',{seconds:sense.oneSecondSense.toFixed(2)},'div'],
        ['senseDrift',{seconds:driftPrefix+sense.driftPerSecond.toFixed(3)},'div'],
        ['senseAverage',{seconds:sense.averageDiff.toFixed(2),label:t(sense.label)},'small']
      ]) {const node=document.createElement(tag);setText(node,key,params);elements.senseScore.appendChild(node);}
    }

    function getResultLabel(type) {
      if (type === 'clear') return t('clear');
      if (type === 'timeout') return t('timeout');
      return t('retire');
    }

    function buildResultShareText(rows) {
      const parts=[t('shareResultTitle',{game:t('gameTitle')}),t('result',{result:getResultLabel(game.resultType)})];
      if(game.resultType==='clear') {
        parts.push(t('shareTargets',{targets:game.targets.map(value=>t('seconds',{value})).join(' / ')}),
          t('shareTaps',{taps:game.taps.map(formatSeconds).join(' / ')}),t('finalScore',{score:game.finalScore.toFixed(2)}));
        if(game.senseResult)parts.push(t('senseOne',{seconds:game.senseResult.oneSecondSense.toFixed(2)}));
      }else parts.push(t('elapsed',{seconds:(game.resultType==='timeout'?MAX_SECONDS:game.endedAt).toFixed(2)}),t('tapCount',{count:game.taps.length,total:3}));
      return parts.join('\n');
    }

    function getGameShareUrl() {
      return 'https://chameleonjp.codeberg.page/anatano_1byou/';
    }

    function buildGameShareText() {
      return [t('gameTitle'), t('shareDescription'), getGameShareUrl()].join('\n');
    }

    function scoreSecondsToSubmit(scoreSeconds) {
      return Math.round(scoreSeconds * SCORE_SCALE);
    }

    function scoreIntToDisplay(scoreInt) {
      const value = Number(scoreInt);
      if (!Number.isFinite(value)) return '---';
      return formatSeconds(value / SCORE_SCALE);
    }

    async function callSupabaseRpc(functionName, payload) {
      if (!hasSupabaseConfig()) throw new Error('Publishable key is not configured.');
      const key=getSupabasePublishableKey(),controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),10000);
      try {
        const response=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+functionName,{
          method:'POST',signal:controller.signal,
          headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},
          body:JSON.stringify(payload)
        });
        const text=await response.text();
        if(!response.ok){
          let detail;try{detail=JSON.parse(text);}catch{}
          throw Object.assign(new Error(functionName+' failed: '+response.status),{code:detail?.code});
        }
        return text?JSON.parse(text):null;
      }finally{clearTimeout(timeout);}
    }

    function resetRankingDisplay() {
      elements.rankingStatus.hidden = true;
      delete elements.rankingStatus.dataset.i18n; elements.rankingStatus.textContent = '';
      elements.rankingReadStatus.hidden = true;
      elements.retrySendBtn.hidden = true;
      elements.retryRankingBtn.hidden = true;
      elements.rankingArea.hidden = true;
      elements.bestRankingList.innerHTML = '';
      elements.firstRankingList.innerHTML = '';
    }

    function setRankingStatus(message) {
      elements.rankingStatus.hidden = false;
      setText(elements.rankingStatus,message);
    }

    function isSubmitRejected(result) {
      const row = Array.isArray(result) ? result[0] : result;
      return Boolean(row && row.accepted === false);
    }

    function saveResultSnapshot() {
      if(game.phase==='result')safeSetItem(RESULT_KEY,JSON.stringify(game));
    }
    function renderSubmissionStatus() {
      const keys={guest:'guestResult',notSubmitted:'notSubmitted',pending:'scorePending',sending:'rankingSending',submitted:'rankingSent',failed:'rankingSendFailed',rejected:'rankingSendFailed'};
      setRankingStatus(keys[game.submissionStatus]||'rankingSendFailed');
      elements.retrySendBtn.hidden=!(game.play&&['pending','failed'].includes(game.submissionStatus));
      elements.retrySendBtn.disabled=game.submissionStatus==='sending';
    }
    function syncRankingAfterResult(rows, token) {
      renderSubmissionStatus();
      void loadRankings(token);
      if(game.resultType==='clear'&&Number.isFinite(game.finalScore)&&game.playerName&&game.play){
        try{scoreQueue.enqueue(game.play,scoreSecondsToSubmit(game.finalScore),game);void scoreQueue.drain();}
        catch{game.submissionStatus='failed';saveResultSnapshot();renderSubmissionStatus();}
      }
    }
    async function loadRankings(token=resultToken) {
      const requestId=++rankingRequestId;
      elements.rankingReadStatus.hidden=false;setText(elements.rankingReadStatus,'rankingLoading');
      elements.retryRankingBtn.hidden=false;elements.retryRankingBtn.disabled=true;
      try {
        const [bestRanking,firstRanking]=await Promise.all([
          callSupabaseRpc('get_best_score_ranking',{p_game_slug:GAME_SLUG,p_limit:RANKING_LIMIT}),
          callSupabaseRpc('get_first_try_ranking',{p_game_slug:GAME_SLUG,p_limit:RANKING_LIMIT})
        ]);
        if(token!==resultToken||requestId!==rankingRequestId||game.phase!=='result')return;
        renderRankingList(elements.bestRankingList,normalizeRankingRows(bestRanking,'best'));
        renderRankingList(elements.firstRankingList,normalizeRankingRows(firstRanking,'first'));
        elements.rankingArea.hidden=false;setText(elements.rankingReadStatus,'rankingLoaded');
      }catch{
        if(token!==resultToken||requestId!==rankingRequestId||game.phase!=='result')return;
        setText(elements.rankingReadStatus,'rankingLoadFailed');
      }finally{
        if(token===resultToken&&requestId===rankingRequestId)elements.retryRankingBtn.disabled=false;
      }
    }
    let queueStorage=null;try{queueStorage=localStorage;}catch{}
    scoreQueue=CommonScoreQueue.createScoreQueue({gameSlug:GAME_SLUG,storage:queueStorage,
      send:payload=>callSupabaseRpc('submit_score_once_shared_v1',payload),
      onChange(item,receipt){
        if(game.phase!=='result'||game.play?.id!==item.id)return;
        game.submissionStatus=item.state==='pending'&&game.submissionStatus==='sending'?'failed':item.state;saveResultSnapshot();renderSubmissionStatus();
        if(receipt)void loadRankings(resultToken);
      }
    });
    function restoreResultSnapshot() {
      let saved;try{saved=JSON.parse(safeGetItem(RESULT_KEY));}catch{return false;}
      if(!saved||saved.phase!=='result'||!['clear','retire','timeout'].includes(saved.resultType)||
        !Array.isArray(saved.targets)||saved.targets.length!==3||!saved.targets.every(n=>Number.isInteger(n)&&n>=TARGET_MIN&&n<=TARGET_MAX)||
        !Array.isArray(saved.taps)||saved.taps.length>3||!saved.taps.every(n=>Number.isFinite(n)&&n>=0&&n<MAX_SECONDS)||
        typeof saved.playerName!=='string'||!Number.isFinite(saved.endedAt)||
        (saved.resultType==='clear'&&(!Number.isFinite(saved.finalScore)||saved.taps.length!==3)))return false;
      // Display only: a reload never turns an unqueued snapshot into a new submission.
      game=saved;resultToken+=1;renderResult(calculateRows());renderSubmissionStatus();showScreen('result');void loadRankings();return true;
    }

    function normalizeRankingRows(data, type) {
      const list = Array.isArray(data) ? data : (data ? [data] : []);
      return list.map((row) => {
        const score = type === 'first'
          ? pickNumber(row, ['first_score', 'result_first_score', 'score', 'best_score', 'result_best_score'])
          : pickNumber(row, ['best_score', 'result_best_score', 'score', 'first_score', 'result_first_score']);

        return {
          rank: pickNumber(row, ['rank_no', 'rank', 'ranking', 'result_rank']),
          name: pickText(row, ['display_name', 'result_display_name', 'player_name', 'name']) || '',
          score,
          playCount: pickNumber(row, ['play_count', 'result_play_count'])
        };
      }).filter((row) => Number.isFinite(row.score));
    }

    function pickText(row, keys) {
      for (const key of keys) {
        if (row && typeof row[key] === 'string' && row[key].trim()) return row[key].trim();
      }
      return '';
    }

    function pickNumber(row, keys) {
      for (const key of keys) {
        const value = row ? Number(row[key]) : NaN;
        if (Number.isFinite(value)) return value;
      }
      return NaN;
    }

    function renderRankingList(container, rows) {
      delete container.dataset.i18n;
      container.innerHTML = '';
      if (!rows.length) {
        setText(container,'noRecords');
        return;
      }

      let previousScore = null;
      let previousRank = 0;
      rows.slice(0,RANKING_LIMIT).forEach((row, index) => {
        const fallbackRank = previousScore !== null && row.score === previousScore ? previousRank : index + 1;
        const rank = Number.isFinite(row.rank) ? row.rank : fallbackRank;
        previousScore = row.score;
        previousRank = rank;

        const div = document.createElement('div');
        div.className = 'ranking-row';
        const rankNode=document.createElement('span');rankNode.className='ranking-rank';setText(rankNode,'rank',{rank});
        const nameNode=document.createElement('span');nameNode.className='ranking-name';
        if(row.name)nameNode.textContent=row.name;else setText(nameNode,'unnamed');
        const scoreNode=document.createElement('span');scoreNode.className='ranking-score';
        setText(scoreNode,Number.isFinite(row.playCount)?'rankingScorePlays':'rankingScore',{score:(row.score/SCORE_SCALE).toFixed(2),plays:row.playCount});
        div.append(rankNode,nameNode,scoreNode);
        container.appendChild(div);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function refreshGameStats() {
      if (!hasSupabaseConfig()) {
        elements.gameStats.hidden = true;
        elements.gameStats.textContent = '';
        return;
      }

      try {
        const data = await callSupabaseRpc('get_game_play_stats', { p_game_slug: GAME_SLUG });
        const row = Array.isArray(data) ? data[0] : data;
        const totalPlayCount = pickNumber(row, ['total_play_count', 'play_count']);
        const playerCount = pickNumber(row, ['player_count', 'players_count']);
        if (Number.isFinite(totalPlayCount) && Number.isFinite(playerCount)) {
          elements.gameStats.hidden = false;
          setText(elements.gameStats,'stats',{players:playerCount,plays:totalPlayCount});
        }
      } catch (error) {
        console.warn(error);
        elements.gameStats.hidden = true;
        elements.gameStats.textContent = '';
      }
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        }
        showToast('clipboardCopied');
      } catch (error) {
        showToast('copyFailed');
      }
    }

    function showToast(message) {
      setText(elements.toast,message);
      elements.toast.classList.add('show');
      if (toastTimerId !== null) clearTimeout(toastTimerId);
      toastTimerId = setTimeout(() => {
        elements.toast.classList.remove('show');
      }, 1000);
    }

    function preventGameTextAction(event) {
      if (event.target.closest('input, textarea')) return;
      event.preventDefault();
    }

    document.addEventListener('contextmenu', preventGameTextAction);
    document.addEventListener('selectstart', preventGameTextAction);
    document.addEventListener('dragstart', preventGameTextAction);

    elements.startBtn.addEventListener('click', requestStartGame);
    elements.retryBtn.addEventListener('click', requestStartGame);
    elements.finishBtn.addEventListener('click', () => {
      clearAllTimers();
      game = createEmptyGame();
      resultToken += 1; rankingRequestId += 1;
      safeSetItem(RESULT_KEY,'');
      renderHome();
      showScreen('home');
    });
    elements.tapBtn.addEventListener('click', handleTap);
    elements.retireBtn.addEventListener('click', handleRetire);
    elements.shareGameBtn.addEventListener('click', () => window.openGameShareX(buildGameShareText()));
    elements.shareResultBtn.addEventListener('click', () => window.openGameShareX(latestShareText + '\n' + getGameShareUrl()));
    elements.playerNameInput.addEventListener('change',()=>{
      const name=elements.playerNameInput.value.trim();if(Array.from(name).length<=20)savePlayerName(name);
    });
    elements.retrySendBtn.addEventListener('click',()=>{void scoreQueue.drain();});
    elements.retryRankingBtn.addEventListener('click',()=>{void loadRankings();});
    window.addEventListener('online',()=>{void scoreQueue.drain();});
    elements.playerNameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.isComposing && event.keyCode !== 229) { event.preventDefault(); requestStartGame(); }
    });

    window.addEventListener('gamelanguagechange',()=>{
      // Reformat only presentation. Never restart a timer, regenerate targets, or resubmit.
      if(game.phase==='result')renderResult(calculateRows());
      const last=safeGetItem(LAST_KEY);
      if(last&&!elements.lastDisplay.hidden)setText(elements.lastDisplay,'lastResult',{result:getResultLabel({'クリア':'clear','時間切れ':'timeout','リタイア':'retire'}[last]||last)});
    });
    const soundToggle=document.getElementById('soundToggle'),soundVolume=document.getElementById('soundVolume');
    function renderAudioControls(){soundToggle.setAttribute('aria-pressed',String(window.gameAudio.enabled));setText(soundToggle,window.gameAudio.enabled?'soundOn':'soundOff');soundVolume.value=String(window.gameAudio.volume);}
    soundToggle.addEventListener('click',()=>{window.gameAudio.setEnabled(!window.gameAudio.enabled);renderAudioControls();});
    soundVolume.addEventListener('input',()=>{window.gameAudio.setVolume(soundVolume.value);});
    soundVolume.addEventListener('change',()=>{void window.gameAudio.play('tap');});
    renderAudioControls();
    elements.playerNameInput.value=getPlayerName();
    resetTapSlots();
    renderHome();
    if(!restoreResultSnapshot())showScreen('home');
    void scoreQueue.drain();
</script>
</body>
</html>
